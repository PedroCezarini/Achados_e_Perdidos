services:
  - type: web
    name: achados-e-perdidos
    env: python
    repo: https://github.com/<SEU_USUARIO>/<SEU_REPO>
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn achados_e_perdidos:app --bind 0.0.0.0:$PORT --workers 3
    envVars:
      - key: ATLAS_CONNECTION_STRING
        scope: private
      - key: SECRET_KEY
        scope: private
